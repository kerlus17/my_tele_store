name: tele_store
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations: 
    sdk: flutter

  
#  flutter pub run build_runner build --delete-conflicting-outputs
  flutter_svg: ^2.3.0
  intl: ^0.20.3
  animate_do: ^5.1.0
  connectivity_plus: ^7.3.1
  flutter_dotenv: ^6.0.1
  flutter_screenutil: ^5.9.3
  flutter_native_splash: 2.4.0
  flutter_bloc: ^9.1.1
  shared_preferences: ^2.5.5
  get_it: ^9.2.1
  googleapis_auth: ^1.6.0
  flutter_animate: ^4.5.2
  
  cupertino_icons: ^1.0.8
  firebase_core: ^4.14.0
  freezed_annotation: ^3.1.0
  dio: ^5.11.1
  pretty_dio_logger: ^1.4.0
  retrofit: ^4.10.0
  json_annotation: ^4.12.0
  fluttertoast: ^9.1.0
  image_picker: ^1.2.3
  permission_handler: 11.3.1
  flutter_zoom_drawer: ^3.2.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  firebase_messaging: ^16.7.0
  
  hive_ce: ^2.20.2
  hive_ce_flutter: ^2.1.0
  webview_flutter: ^4.14.1
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: 10.2.0
  flutter_launcher_icons: ^0.14.4
  build_runner: ^2.15.1
  freezed: ^3.1.0
  json_serializable: ^6.14.1
  retrofit_generator: ^10.2.9
  hive_ce_generator: ^1.11.1
  flutter_lints: ^6.0.0

flutter_icons:
  android: true
  ios: true
  image_pass: "assets/icons/app_icon.jpg"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icons/play_store_512.png"

flutter:
  uses-material-design: true

  assets:
    - .env.dev
    - .env.prod
    - lang/ar.json
    - lang/en.json
    - assets/images/core/
    - assets/images/admin/
    - assets/images/customer/
    - assets/svg/

  fonts:
    - family: cairo
      fonts:
        - asset: assets/fonts/arabic/cairo/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/arabic/cairo/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/arabic/cairo/Cairo-Regular.ttf
          weight: 400
         
    - family: poppins 
      fonts:
        - asset: assets/fonts/english/poppins/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/english/poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/english/poppins/Poppins-Regular.ttf
          weight: 400